# Runs every feature's local tests, then the cloud parts: right after a feature merges to main, and daily.
# Cloud jobs run only when the matching access is configured (Databricks secrets / GCP keyless variables).
name: Daily run

on:
  schedule:
    - cron: "17 14 * * *"   # 09:17 Chicago (CDT)
  push:
    branches: [main]
    paths: ["features/**"]
  workflow_dispatch:

concurrency:
  group: daily-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  databricks:
    needs: local
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when Databricks isn't connected
        id: gate
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then
            echo "Databricks secrets not set; skipping cloud runs."; echo "run=false" >> "$GITHUB_OUTPUT"
          else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.run == 'true'
        uses: databricks/setup-cli@main
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.run == 'true'
        name: Run each Databricks feature (bundle job or cloud.sh)
        run: |
          failed=0
          for d in features/databricks/day-*/; do
            echo "::group::$d"
            if [ -f "$d/databricks.yml" ]; then
              (cd "$d" && databricks bundle deploy -t dev && databricks bundle run -t dev daily) || { echo "::error::$d failed"; failed=1; }
            elif [ -f "$d/cloud.sh" ]; then
              (cd "$d" && bash cloud.sh) || { echo "::error::$d failed"; failed=1; }
            fi
            echo "::endgroup::"
          done
          exit $failed

  gcp:
    needs: local
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # keyless sign-in through Workload Identity Federation
    if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != ''
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run each Google Cloud feature's cloud.sh
        env:
          GCP_PROJECT_ID: ${{ steps.auth.outputs.project_id }}
          GCP_REGION: us-central1
        run: |
          gcloud config set project "$GCP_PROJECT_ID" --quiet
          failed=0
          for s in features/gcp/day-*/cloud.sh; do
            [ -f "$s" ] || continue
            d=$(dirname "$s"); echo "::group::$d"
            (cd "$d" && bash cloud.sh) || { echo "::error::$d failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed
